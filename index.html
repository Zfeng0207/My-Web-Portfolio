<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            background-color: #ffebcd;
            background-image: url('assets/pooh.webp'); /* Local background image */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .valentine-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .button {
            background-color: #ff69b4;
            color: white;
            padding: 15px 30px;
            border: none;
            font-size: 20px;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 10px;
        }
        .button:hover {
            background-color: #ff1493;
        }
    </style>
</head>
<body>
    <div class="valentine-box" id="content">
        <h1>Would you be my Valentine? 🥺❤️</h1>
        <button class="button" onclick="nextPage(true)">Yes 😊</button>
        <button class="button" onclick="nextPage(false)">No 😢</button>
    </div>

    <script>
        let step = 0;
        
        function nextPage(choice) {
            let content = document.getElementById('content');
            if (!choice) {
                content.innerHTML = `<h1>No is not an option! 😠</h1>
                                     <button class="button" onclick="reset()">Try Again</button>`;
                return;
            }
            
            step++;
            if (step === 1) {
                content.innerHTML = `<h1>Do you lub lub me? 😘❤️</h1>
                                     <button class="button" onclick="nextPage(true)">Yes 😊</button>
                                     <button class="button" onclick="nextPage(false)">No 😢</button>`;
            } else if (step === 2) {
                content.innerHTML = `<h1>Am I getting lucky tonight? 😉</h1>
                                     <button class="button" onclick="nextPage(true)">Yes 😊</button>
                                     <button class="button" onclick="nextPage(false)">No 😢</button>`;
            } else {
                content.innerHTML = `<h1>See you tmr! ❤️</h1>`;
            }
        }
        
        function reset() {
            step = 0;
            let content = document.getElementById('content');
            content.innerHTML = `<h1>Would you be my Valentine? 🥺❤️</h1>
                                 <button class="button" onclick="nextPage(true)">Yes 😊</button>
                                 <button class="button" onclick="nextPage(false)">No 😢</button>`;
        }
    </script>
</body>
</html>
